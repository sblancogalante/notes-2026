<title>__TITULO__</title>
<style>
  :root{
    --bg:#EFE0E8; --surface:#FDF5F8; --surface-2:#F4E3EB;
    --ink:#2B2028; --ink-2:#574A53; --muted:#75636E;
    --line:#E9D4DF; --line-2:#D8BDCC;
    --accent:#7D4B6B;
    --display:Cormorant Garamond,Georgia,Times New Roman,serif;
    --body:Karla,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#191319; --surface:#221B22; --surface-2:#2C232C;
      --ink:#F3EAEF; --ink-2:#D5C7CF; --muted:#A08F99;
      --line:#372D37; --line-2:#4A3C47;
      --accent:#DBA6C4;
    }
  }
  :root[data-theme="dark"]{
    --bg:#191319; --surface:#221B22; --surface-2:#2C232C;
    --ink:#F3EAEF; --ink-2:#D5C7CF; --muted:#A08F99;
    --line:#372D37; --line-2:#4A3C47;
    --accent:#DBA6C4;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--body); font-size:16px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; min-height:100svh; padding:1.5rem;
  }
  .caja{width:100%; max-width:32rem}
  header{margin-bottom:1.75rem}
  h1{
    font-family:var(--display); font-weight:600; font-size:clamp(2rem,7vw,2.75rem);
    line-height:1.1; margin:0 0 .5rem; letter-spacing:.01em; text-wrap:balance;
  }
  .lede{margin:0; color:var(--muted); max-width:30rem}
  ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.75rem}
  .tarjeta{
    display:block; text-decoration:none; color:inherit;
    background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:1.05rem 1.2rem;
    transition:border-color .15s ease, transform .15s ease, background .15s ease;
  }
  .tarjeta:hover,.tarjeta:focus-visible{
    background:var(--surface-2); border-color:var(--line-2); transform:translateY(-1px);
  }
  .tarjeta:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .tarjeta .t{
    display:block; font-family:var(--display); font-weight:600;
    font-size:1.35rem; line-height:1.2; color:var(--accent);
  }
  .tarjeta .s{
    display:block; margin-top:.15rem; color:var(--muted);
    font-size:.85rem; letter-spacing:.04em; text-transform:uppercase;
  }
  footer{margin-top:1.75rem; color:var(--muted); font-size:.85rem}
  @media (prefers-reduced-motion:reduce){.tarjeta{transition:none}.tarjeta:hover{transform:none}}
</style>
</head>
<body>
  <main class="caja">
    <header>
      <h1>__TITULO__</h1>
      <p class="lede">__LEDE__</p>
    </header>
    <ul>
__TARJETAS__
    </ul>
    <footer>Cada guía tiene su propio código QR adentro, para pasarla de un teléfono a otro.</footer>
  </main>
</body>
